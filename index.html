<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      const navigationEntry =
        typeof performance.getEntriesByType === 'function'
          ? performance.getEntriesByType('navigation')[0]
          : undefined
      const prefersReducedMotion = window.matchMedia(
        '(prefers-reduced-motion: reduce)'
      ).matches

      if (navigationEntry?.type === 'reload' && !window.location.hash) {
        if ('scrollRestoration' in history) {
          history.scrollRestoration = 'manual'
        }

        window.addEventListener(
          'pageshow',
          () => {
            window.scrollTo(0, 0)

            if ('scrollRestoration' in history) {
              history.scrollRestoration = 'auto'
            }
          },
          { once: true }
        )
      }

      if (!prefersReducedMotion) {
        document.documentElement.classList.add('hero-motion-pending')
        window.setTimeout(() => {
          const root = document.documentElement

          if (!root.classList.contains('hero-motion-pending')) return

          if ('fonts' in document && document.fonts.status === 'loaded') {
            root.classList.remove('hero-motion-pending')
            return
          }

          root.classList.add('hero-motion-skipped')
          root.classList.remove('hero-motion-pending')
        }, 1500)
      }

      if ('IntersectionObserver' in window && !prefersReducedMotion) {
        document.documentElement.classList.add('reveal-ready')
        window.setTimeout(() => {
          document.documentElement.classList.remove('reveal-ready')
        }, 3000)
      }
    </script>
